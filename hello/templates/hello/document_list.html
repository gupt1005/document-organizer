<form method="GET">
    <label>Category:</label>
    <select name="category">
        <option value="">All</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}"
                {% if cat.id|stringformat:"s" == selected_category %}selected{% endif %}>
                {{ cat.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Start Date:</label>
    <input type="date" name="start_date" value="{{ selected_start|default:'' }}">

    <label>End Date:</label>
    <input type="date" name="end_date" value="{{ selected_end|default:'' }}">

    <br><br>
    <button type="submit">Filter</button>
</form>

<hr>

<a href="{% url 'document_create' %}">+ Add Document</a>

<ul>
    {% for doc in documents %}
        <li>
            {{ doc.name }} — {{ doc.category.name }} — {{ doc.renewal_date }}
            <a href="{% url 'document_update' doc.pk %}">Edit</a>
            <a href="{% url 'document_delete' doc.pk %}">Delete</a>
        </li>
    {% empty %}
        <li>No documents found.</li>
    {% endfor %}
</ul>
